<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Lamborghini Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #ffffff18; color: #fff; border: 1px solid #ffffff40; border-radius: 8px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  button:hover { background: #ffffff30; }
  #hint { position: fixed; top: 14px; width: 100%; text-align: center; color: #ffffff99; font-size: 14px; pointer-events: none; }
  #note { position: fixed; right: 16px; bottom: 16px; max-width: 320px; text-align: right; color: #ffffff66; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="hint">Drag to rotate · scroll/pinch to zoom</div>
<div id="ui">
  <button id="spin">Auto-rotate: on</button>
  <button id="paint">Colour: golden yellow</button>
</div>
<div id="note"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const lerp = THREE.MathUtils.lerp;

/* ------------------------------------------------------------------ renderer / scene */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080b);
scene.fog = new THREE.Fog(0x07080b, 14, 30);

// studio environment: dark room with soft-box strips, so the paint gets long highlights
function studioEnvironment() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(40, 14, 40), new THREE.MeshBasicMaterial({ color: 0x1a1c22, side: THREE.BackSide })));
  const panel = (w, h, x, y, z, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(i, i, i), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(16, 6, 0, 6.5, 0, 5);        // overhead
  panel(3, 8, -9, 3, 3, 9);          // left strip
  panel(3, 8, 9, 3, -4, 9);          // right strip
  panel(10, 3, 0, 2.5, -12, 4);      // back
  panel(8, 2.5, 3, 2, 12, 3);        // front fill
  return new THREE.PMREMGenerator(renderer).fromScene(s, 0.02).texture;
}
scene.environment = studioEnvironment();

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.3, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.05, 0.5, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 2.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2 - 0.01;

// low front three-quarter view that fills the screen (car front points to +x, camera on +z side)
function frameCar() {
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const d = 5.1 / (2 * Math.tan(hfov / 2) * 0.9);
  camera.position.copy(controls.target).add(new THREE.Vector3(0.62, 0.15, 0.77).normalize().multiplyScalar(d));
}
frameCar();

const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(3, 7, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xaab8ff, 0x201a14, 0.35));

const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x0e1014, roughness: 0.6, metalness: 0.2 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// soft contact shadow under the car
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), grd = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.85)'); grd.addColorStop(0.55, 'rgba(0,0,0,0.45)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.3),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.002; scene.add(blob);
}

/* ------------------------------------------------------------------ materials */
const paint = new THREE.MeshPhysicalMaterial({ color: 0xf2a900, metalness: 0.5, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.03, side: THREE.DoubleSide });
const black = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.5, metalness: 0.3, side: THREE.DoubleSide });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x05060a, roughness: 0.04, metalness: 0.5, clearcoat: 1, envMapIntensity: 1.8, side: THREE.DoubleSide });
const tailRed = new THREE.MeshStandardMaterial({ color: 0x200000, emissive: 0xc80c06, emissiveIntensity: 1.4, side: THREE.DoubleSide });
const lightHousing = new THREE.MeshPhysicalMaterial({ color: 0x050507, roughness: 0.08, metalness: 0.6, clearcoat: 1, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
const led = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xe8f0ff, emissiveIntensity: 3, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.85 });
const rimMat = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.3, metalness: 0.9 });
const steel = new THREE.MeshStandardMaterial({ color: 0x6d7076, roughness: 0.35, metalness: 1 });
const caliperMat = new THREE.MeshStandardMaterial({ color: 0xb8141b, roughness: 0.35, metalness: 0.4 });
const capMat = new THREE.MeshStandardMaterial({ color: 0x1d3f9c, roughness: 0.3, metalness: 0.6 });

/* ------------------------------------------------------------------ procedural body */
const YB = 0.115;                                                    // ride height underneath
const ARCHES = [{ x: 1.31, y: 0.345, R: 0.385 }, { x: -1.31, y: 0.355, R: 0.395 }];
// [x, fender-top height, half width]; front of the car is +x
const BODY = [
  [-2.26, 0.80, 0.76], [-2.10, 0.86, 0.85], [-1.80, 0.94, 0.93], [-1.35, 0.98, 0.98], [-0.90, 0.93, 0.97],
  [-0.30, 0.84, 0.95], [0.30, 0.82, 0.94], [0.85, 0.85, 0.95], [1.20, 0.82, 0.95], [1.55, 0.76, 0.935],
  [1.90, 0.60, 0.88], [2.14, 0.46, 0.78], [2.26, 0.40, 0.64],
];
const CAP_DX = [0.010, 0.022, 0.034, 0.045, 0.053, 0.058], CAP_S = [0.97, 0.90, 0.76, 0.55, 0.30, 0.08];
const SUB = [1, 1, 1, 2, 3, 2, 2, 2, 1];

// right half of the cross-section (floor centre -> sill -> shoulder -> crease -> roof centre); flag 1 = may be carved by wheel arches
function halfProfile(x, yt, w) {
  const dip = 0.085 * THREE.MathUtils.smoothstep(x, 0.15, 0.95);
  const ym = YB + (yt - YB) * 0.56, yu = yt - 0.05;
  const a = [[0, YB], [0.45, YB], [0.86, YB], [0.955, YB + 0.07], [0.99, YB + 0.2], [1, ym], [0.95, yu], [0.74, yt], [0.32, yt - dip], [0, yt - dip + 0.012]];
  const out = [];
  for (let i = 0; i < 9; i++) for (let s = 0; s < SUB[i]; s++) {
    const t = s / SUB[i];
    out.push([w * lerp(a[i][0], a[i + 1][0], t), lerp(a[i][1], a[i + 1][1], t), i <= 6 ? 1 : 0]);
  }
  out.push([0, a[9][1], 0]);
  return out;
}
const fullRing = right => right.concat(right.slice(1, -1).map(([z, y, c]) => [-z, y, c]).reverse());

const bodySpline = new THREE.CatmullRomCurve3(BODY.map(b => new THREE.Vector3(...b)), false, 'centripetal');
const STATIONS = bodySpline.getSpacedPoints(260);                    // x ascending (rear -> front)

// surface lookups so details can be draped on the body
function stationHeight(s, az) {
  const p = halfProfile(s.x, s.y, s.z);
  az = Math.min(az, p[9][0]);                                       // never sample past the shoulder
  for (let i = p.length - 1; i >= 10; i--) {
    const [z0, y0] = p[i - 1], [z1, y1] = p[i];
    if (az <= z0 && az >= z1) return lerp(y1, y0, (az - z1) / Math.max(z0 - z1, 1e-6));
  }
  return p[9][1];
}
function heightAt(x, az) {                                          // interpolates between the two neighbouring stations
  let i = 0; while (i < STATIONS.length - 2 && STATIONS[i + 1].x < x) i++;
  const s0 = STATIONS[i], s1 = STATIONS[i + 1], t = THREE.MathUtils.clamp((x - s0.x) / (s1.x - s0.x), 0, 1);
  return lerp(stationHeight(s0, az), stationHeight(s1, az), t);
}

// which material each body quad gets (0 paint, 1 black trim, 2 tail light). `e` is the cross-section edge index
// (0 = underside ... 14 = bonnet centre) mirrored left/right, so trim edges follow the mesh grid cleanly.
function bodyMaterial(cx, cy, cz, e, carvedAll) {
  const az = Math.abs(cz);
  if (carvedAll) return 1;                                          // wheel-arch liner
  if (e <= 3) return 1;                                             // sills, splitter, floor
  if (cx > 2.08 && e <= 7) return 1;                                // front intake
  if (cx > 1.9 && cx < 2.12 && e >= 4 && e <= 6 && az > 0.5) return 1; // angular corner intakes
  if (cx < -2.12 && e <= 6) return 1;                               // rear diffuser area
  if (cx < -2.17 && e >= 8 && e <= 9 && az > 0.18) return 2;       // tail lights
  if (cx < -1.0 && cx > -1.85 && e >= 13) return 1;                 // engine-bay vents
  if (cx > -0.8 && cx < -0.18 && e >= 5 && e <= 7 && az > 0.88) return 1; // side intake
  if (e >= 3 && e <= 10 && az > 0.88 && (Math.abs(cx - 0.6) < 0.009 || Math.abs(cx + 0.3) < 0.009)) return 1; // door shut lines
  return 0;
}

function buildBody() {
  const rings = [];
  const stations = STATIONS.map(p => ({ x: p.x, yt: p.y, w: p.z, s: 1 }));
  const nose = stations[stations.length - 1], tail = stations[0];
  CAP_DX.forEach((dx, i) => {
    stations.push({ ...nose, x: nose.x + dx, s: CAP_S[i] });
    stations.unshift({ ...tail, x: tail.x - dx, s: CAP_S[i] });
  });
  stations.sort((a, b) => a.x - b.x);
  for (const st of stations) {
    const yc = (YB + st.yt) / 2;
    rings.push(fullRing(halfProfile(st.x, st.yt, st.w)).map(([z, y, c]) => {
      let yy = lerp(yc, y, st.s), carved = false;
      if (c) for (const A of ARCHES) {
        const dx = st.x - A.x;
        if (Math.abs(dx) < A.R) { let ya = A.y + Math.sqrt(A.R * A.R - dx * dx); if (Math.abs(z) < 0.5 * st.w) ya = Math.min(ya, 0.42); /* keep the tunnel under the bonnet */ if (yy < ya) { yy = ya; carved = true; } }
      }
      return { x: st.x, y: yy, z: z * st.s, carved };
    }));
  }
  const R = rings[0].length, K = rings.length, pos = [], mats = [[], [], []];
  rings.forEach(r => r.forEach(v => pos.push(v.x, v.y, v.z)));
  for (let k = 0; k < K - 1; k++) for (let j = 0; j < R; j++) {
    const v = [rings[k][j], rings[k][(j + 1) % R], rings[k + 1][j], rings[k + 1][(j + 1) % R]];
    const cx = (v[0].x + v[1].x + v[2].x + v[3].x) / 4, cy = (v[0].y + v[1].y + v[2].y + v[3].y) / 4, cz = (v[0].z + v[1].z + v[2].z + v[3].z) / 4;
    const m = bodyMaterial(cx, cy, cz, j < 15 ? j : 29 - j, v.every(q => q.carved));
    const a = k * R + j, b = k * R + (j + 1) % R, c = (k + 1) * R + j, d = (k + 1) * R + (j + 1) % R;
    mats[m].push(a, b, c, b, d, c);
  }
  for (const [k, flip] of [[0, true], [K - 1, false]]) {               // close the two tiny end holes
    const c = pos.length / 3, y = rings[k].reduce((s, v) => s + v.y, 0) / R;
    pos.push(rings[k][0].x, y, 0);
    for (let j = 0; j < R; j++) { const a = k * R + j, b = k * R + (j + 1) % R; mats[0].push(...(flip ? [c, a, b] : [c, b, a])); }
  }
  return finish(pos, mats);
}

// glass house: body-colour roof/pillars, separate dark windshield, side windows and rear screen
function buildCabin() {
  const C = [[-1.38, 0.90, 0.84], [-1.15, 0.97, 0.78], [-0.80, 1.07, 0.70], [-0.40, 1.14, 0.66], [0.0, 1.165, 0.64],
             [0.30, 1.12, 0.68], [0.60, 1.02, 0.73], [0.85, 0.93, 0.78], [1.06, 0.845, 0.83]];
  const pts = new THREE.CatmullRomCurve3(C.map(c => new THREE.Vector3(...c)), false, 'centripetal').getSpacedPoints(200);
  const ybc = 0.62, rings = [], kinds = [];                          // kinds: segment type per ring edge
  for (const p of pts) {
    const yt = p.y, w = p.z, belt = Math.min(0.84, yt - 0.03), ysh = belt + (yt - belt) * 0.72;
    const a = [[0, ybc], [w * 1.02, ybc], [w, belt], [w * 0.9, ysh], [w * 0.62, yt], [0, yt + 0.012]];
    const sub = [1, 2, 3, 2, 3], right = [], kind = [];              // kind: 0 hidden base, 1 side glass, 2 pillar, 3 roof/screen
    const types = [0, 0, 1, 2, 3];
    for (let i = 0; i < 5; i++) for (let s = 0; s < sub[i]; s++) {
      const t = s / sub[i]; right.push([lerp(a[i][0], a[i + 1][0], t), lerp(a[i][1], a[i + 1][1], t)]); kind.push(types[i]);
    }
    right.push([0, a[5][1]]);
    const L = right.length;
    const ring = right.concat(right.slice(1, -1).map(([z, y]) => [-z, y]).reverse());
    const edgeKinds = kind.concat([kind[L - 2]]);                     // edge leaving each ring point (right half + roof centre)
    for (let m = L - 2; m >= 1; m--) edgeKinds.push(kind[m - 1]);     // left half mirrors the right-half edges
    rings.push(ring.map(([z, y]) => ({ x: p.x, y, z }))); kinds.push(edgeKinds);
  }
  const R = rings[0].length, K = rings.length, pos = [], mats = [[], []];
  rings.forEach(r => r.forEach(v => pos.push(v.x, v.y, v.z)));
  for (let k = 0; k < K - 1; k++) for (let j = 0; j < R; j++) {
    const x = (rings[k][0].x + rings[k + 1][0].x) / 2, type = kinds[k][j];
    let isGlass = false;
    if (type === 1 && x > -0.62 && x < 0.74) isGlass = true;          // side windows
    if (type === 3 && ((x > 0.16 && x < 1.03) || (x > -1.22 && x < -0.72))) isGlass = true; // windshield / rear screen
    const a = k * R + j, b = k * R + (j + 1) % R, c = (k + 1) * R + j, d = (k + 1) * R + (j + 1) % R;
    mats[isGlass ? 1 : 0].push(a, b, c, b, d, c);
  }
  return finish(pos, mats);
}

function finish(pos, mats) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const all = []; let start = 0;
  mats.forEach((m, i) => { if (m.length) { g.addGroup(start, m.length, i); all.push(...m); start += m.length; } });
  g.setIndex(all);
  return toCreasedNormals(g, 0.75);
}

const car = new THREE.Group();
scene.add(car);
const procedural = new THREE.Group();
car.add(procedural);
function put(geo, mats, parent = procedural) { const m = new THREE.Mesh(geo, mats); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; }

put(buildBody(), [paint, black, tailRed]);
put(buildCabin(), [paint, glass]);

/* ---- overlays draped on the body surface (headlights) */
function drape(poly, mat, lift) {
  let tris = new THREE.ShapeGeometry(new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, z)))).toNonIndexed().attributes.position.array;
  let list = []; for (let i = 0; i < tris.length; i += 9) list.push([[tris[i], tris[i + 1]], [tris[i + 3], tris[i + 4]], [tris[i + 6], tris[i + 7]]]);
  const edge = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  for (let pass = 0; pass < 6; pass++) {
    const next = [];
    for (const [a, b, c] of list) {
      if (Math.max(edge(a, b), edge(b, c), edge(c, a)) < 0.05) { next.push([a, b, c]); continue; }
      const m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], ab = m(a, b), bc = m(b, c), ca = m(c, a);
      next.push([a, ab, ca], [ab, b, bc], [ca, bc, c], [ab, bc, ca]);
    }
    list = next;
  }
  const pos = [];
  for (const side of [1, -1]) for (const tri of list) for (const [x, z] of tri) pos.push(x, heightAt(x, z) + lift, z * side);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); procedural.add(m); return m;
}
// angular headlight: black housing + LED daytime-running strip + projector LEDs (x, |z|)
drape([[1.62, 0.84], [1.80, 0.81], [2.14, 0.52], [2.17, 0.44], [2.02, 0.46], [1.66, 0.70]], lightHousing, 0.01);
drape([[1.74, 0.79], [1.80, 0.795], [2.10, 0.53], [2.12, 0.50], [2.06, 0.505]], led, 0.014);
drape([[1.70, 0.70], [1.76, 0.715], [2.00, 0.50], [1.99, 0.48]], led, 0.014);
for (const [x, z] of [[1.82, 0.70], [1.92, 0.62]]) for (const s of [1, -1]) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.022, 20), led);
  m.rotation.x = -Math.PI / 2; m.position.set(x, heightAt(x, z) + 0.016, z * s); procedural.add(m);
}

/* ---- mirrors + exhausts */
for (const s of [1, -1]) {
  const mirror = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), paint);
  mirror.scale.set(0.15, 0.075, 0.055); mirror.position.set(0.72, 0.9, s * 1.0); mirror.rotation.y = -s * 0.25; mirror.castShadow = true; procedural.add(mirror);
  const stalk = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, 0.14), black); stalk.position.set(0.76, 0.86, s * 0.9); procedural.add(stalk);
  const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.2, 24, 1, true), steel);
  pipe.rotation.z = Math.PI / 2; pipe.position.set(-2.3, 0.4, s * 0.36); procedural.add(pipe);
}

/* ---- wheels: tyre, black five-Y-spoke rim, brake disc + caliper, blue centre cap */
function makeWheel(r, hw) {
  const g = new THREE.Group();
  const tp = [[0.255, 0.93], [0.275, 1], [0.31, 0.97], [0.335, 0.78], [r, 0.52], [r, 0], [r, -0.52], [0.335, -0.78], [0.31, -0.97], [0.275, -1], [0.255, -0.93]]
    .map(([rad, t]) => new THREE.Vector2(rad, t * hw));
  const tyre = new THREE.Mesh(new THREE.LatheGeometry(tp, 64), tireMat); tyre.rotation.x = Math.PI / 2; tyre.castShadow = true; g.add(tyre);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.258, 0.258, hw * 1.7, 48, 1, true), rimMat); barrel.rotation.x = Math.PI / 2; g.add(barrel);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.262, 0.012, 10, 64), rimMat); lip.position.z = hw * 0.86; g.add(lip);
  // spoke face
  const shapes = [], poly = (r0, a0, hw0, r1, a1, hw1) => {
    const P = (r, a) => new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r), s = new THREE.Shape();
    s.moveTo(...P(r0, a0 - hw0).toArray()); s.lineTo(...P(r1, a1 - hw1).toArray()); s.lineTo(...P(r1, a1 + hw1).toArray()); s.lineTo(...P(r0, a0 + hw0).toArray()); return s;
  };
  for (let i = 0; i < 5; i++) {
    const th = (i / 5) * Math.PI * 2;
    shapes.push(poly(0.08, th - 0.05, 0.07, 0.255, th - 0.3, 0.075), poly(0.08, th + 0.05, 0.07, 0.255, th + 0.3, 0.075));
  }
  const face = new THREE.Mesh(new THREE.ExtrudeGeometry(shapes, { depth: 0.035, bevelEnabled: true, bevelSize: 0.006, bevelThickness: 0.006, bevelSegments: 2 }), rimMat);
  face.position.z = hw * 0.55; face.castShadow = true; g.add(face);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.05, 32), rimMat); hub.rotation.x = Math.PI / 2; hub.position.z = hw * 0.5; g.add(hub);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.02, 24), capMat); cap.rotation.x = Math.PI / 2; cap.position.z = hw * 0.5 + 0.03; g.add(cap);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.032, 48), steel); disc.rotation.x = Math.PI / 2; disc.position.z = hw * 0.12; g.add(disc);
  const cal = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.075, 24, 1, false, 0, 0.8), caliperMat);
  cal.rotation.x = Math.PI / 2; cal.rotation.z = Math.PI / 2 - 0.4; cal.position.z = hw * 0.12; g.add(cal);
  return g;
}
for (const [x, r, hw] of [[1.31, 0.345, 0.135], [-1.31, 0.355, 0.158]]) for (const s of [1, -1]) {
  const w = makeWheel(r, hw);
  w.position.set(x, r, s * 0.8); if (s < 0) w.rotation.y = Math.PI;
  procedural.add(w);
}

/* ------------------------------------------------------------------ optional licensed model: put car.glb next to this file */
const note = document.getElementById('note');
note.textContent = 'Procedural model. To use a real licensed model, add car.glb next to this file.';
const bodyMats = [paint];
(async () => {
  try {
    const head = await fetch('car.glb', { method: 'HEAD' });
    if (!head.ok) return;
    const gltf = await new GLTFLoader().loadAsync('car.glb');
    const m = gltf.scene, box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
    const long = Math.max(size.x, size.z);
    m.scale.setScalar(4.5 / long);
    if (size.z > size.x) m.rotation.y = Math.PI / 2;
    box.setFromObject(m); const c = box.getCenter(new THREE.Vector3());
    m.position.set(-c.x, -box.min.y, -c.z);
    m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; const ms = [].concat(o.material); ms.forEach(q => { if (/paint|body/i.test(q.name)) bodyMats.push(q); }); } });
    car.add(m); procedural.visible = false;
    note.textContent = 'Model: car.glb';
  } catch (e) { /* no glb: keep the procedural car */ }
})();

/* ------------------------------------------------------------------ UI + loop */
const spin = document.getElementById('spin');
spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.textContent = 'Auto-rotate: ' + (controls.autoRotate ? 'on' : 'off'); };
const colours = [['golden yellow', 0xf2a900], ['orange', 0xff5a00], ['green', 0x1f9d4a], ['white', 0xf1f1ee], ['blue', 0x1648c8], ['red', 0xc40d14], ['black', 0x131316]];
let ci = 0;
document.getElementById('paint').onclick = e => {
  ci = (ci + 1) % colours.length; bodyMats.forEach(m => m.color.setHex(colours[ci][1]));
  e.target.textContent = 'Colour: ' + colours[ci][0];
};
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__car = { camera, controls, frameCar };   // used by the automated screenshot test
</script>
